name: Assemble site SC
on:
  push:
    branches: [main]
    paths:
      - '_transfer/**'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Montar HTML completo e validar integridade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          parts = sorted(Path("_transfer").glob("part_*.txt"))
          if len(parts) != 47:
              raise RuntimeError(f"Esperados 47 blocos, encontrados {len(parts)}")
          data = b"".join(f.read_bytes() for f in parts)
          expected = "33f256cd6113f1ffdb97991f9fb9333d7fad6610fc6361ec5d421d152103eb9d"
          actual = sha256(data).hexdigest()
          if actual != expected:
              raise RuntimeError(f"Integridade do HTML falhou: {actual}")
          if not data.rstrip().endswith(b"</html>"):
              raise RuntimeError("HTML final truncado")
          Path("index.html").write_bytes(data)
          print(f"Pronto: {len(data)} bytes; SHA256={actual}")
          PY
      - name: Publicar o site e limpar blocos temporarios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -qr _transfer
          git commit -m "feat: publicar site SC clean V7 completo [skip ci]"
          git push origin HEAD:main
